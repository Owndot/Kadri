name: Bauen und testen
on:
  push:
    branches: [main]
    paths-ignore: ['tests/mess_validation.py', '.github/workflows/performance-validation.yml', '*.md']
  workflow_dispatch:
  pull_request:
    paths-ignore: ['tests/mess_validation.py', '.github/workflows/performance-validation.yml', '*.md']
permissions:
  contents: read
jobs:
  build-test:
    if: github.head_ref != 'codex/pip-lifecycle' && github.head_ref != 'codex/pairing-key-recovery' && github.head_ref != 'codex/browser-proxy-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb zip
      - name: Bauen
        run: node tools/build.js --test
      - name: Referrer policy and real HTTP/HTTPS redirects
        run: |
          set -euo pipefail
          node tests/referrer_check.js
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p /tmp/privacy-media
          ffmpeg -v error -y -f lavfi -i testsrc2=size=320x180:rate=24 -t 8 -c:v libx264 -threads 1 -pix_fmt yuv420p -g 48 -movflags +faststart /tmp/privacy-media/clip.mp4
          EXT_DIR="$PWD/dist/test" xvfb-run -a python3 -u tests/privacy_browser.py --kadri
      - name: Prove recovery regression against the broken predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api 'repos/Owndot/Kadri/contents/chrome/background.js?ref=af294d1' --jq .content | base64 --decode > "$RUNNER_TEMP/previous-background.js"
          if timeout 60 node - "$RUNNER_TEMP/previous-background.js" > "$RUNNER_TEMP/previous-recovery.log" 2>&1 <<'JS'
          const fs=require('fs'), run=require('./tests/header_context_check.js');
          run(fs.readFileSync(process.argv[2],'utf8'),{URL,AbortController,setTimeout,clearTimeout})
            .then(()=>{},error=>{console.error(error);process.exitCode=1;});
          JS
          then
            echo 'Broken predecessor unexpectedly passed'; exit 1
          fi
          cat "$RUNNER_TEMP/previous-recovery.log"
          grep -q 'setup failure never recovered' "$RUNNER_TEMP/previous-recovery.log"
          node tests/header_context_check.js
          echo 'PASS: predecessor fails the recovery assertion; current source passes'
      - name: Security lifecycle tests first
        run: TESTS="test_abort.py test_guard.py test_redirect.py test_worker_restart.py" tests/run_all.sh
      - name: Remaining Chromium tests
        shell: bash
        run: |
          export TESTS="$(python3 -c 'import glob,os; print(" ".join(os.path.basename(p) for p in sorted(glob.glob("tests/test_*.py")) if os.path.basename(p) not in {"test_abort.py","test_guard.py","test_redirect.py","test_worker_restart.py"}))')"
          tests/run_all.sh | tee ergebnis.txt
          echo '### Ergebnis' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kadri
          path: |
            dist/kadri-*.zip
            tests/out/*.log

  pairing-recovery:
    if: github.head_ref == 'codex/pairing-key-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cc14bcdfb8a7a7d296c32ab3943c74b291be6ac4
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Chromium test tools only
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          timeout 90 pip install --timeout 30 --retries 1 playwright==1.56.0
          # Run40304715724 spent >11 minutes on Azure mirror downloads.
          # Same signed official Ubuntu archive, already used by Helper validation.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          timeout 240 python -m playwright install --with-deps chromium
          command -v xvfb-run
          command -v zip
      - name: Prove stale-key regression on unchanged main
        run: |
          set -euo pipefail
          node baseline/tools/build.js --test
          if timeout 100 env KADRI_EXT="$PWD/baseline/dist/test" xvfb-run -a python3 -u tests/test_repair.py > /tmp/old-browser.log 2>&1; then echo 'Browser baseline unexpectedly recovered'; exit 1; fi
          grep -q 'existing tab kept stale key after re-pairing' /tmp/old-browser.log
          echo 'PASS: actual old source and old Chromium extension reproduce stale-key failure'
      - name: Fixed adapters and focused real extension checks
        run: |
          set -euo pipefail
          node tests/referrer_check.js
          node tests/header_context_check.js
          node tests/ff_net_check.js firefox/background.js
          node tools/build.js --test
          xvfb-run -a python3 -u tests/test_repair.py
          TESTS="test_repair.py test_helper.py test_proxy.py" tests/run_all.sh

  helper-key-regression:
    # Regular fast guard for every matching PR and main push, independent of branch name.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        if: github.head_ref == 'codex/pairing-key-recovery'
        with:
          ref: 85c0d3c7fa8b3ec75f0f7abba68fbf9a8b2f5796
          path: review-baseline
          persist-credentials: false
      - name: Reproduce both reviewed races on the previous PR head
        if: github.head_ref == 'codex/pairing-key-recovery'
        run: |
          set -euo pipefail
          for target in chrome firefox; do
            for race in event-race initial-race; do
              if node tests/helper_repair_check.js review-baseline --target="$target" --case="$race" > /tmp/race.log 2>&1; then echo 'Reviewed race not reproduced'; exit 1; fi
              grep -Eq 'request before storage event used stale key|initialization lost storage change' /tmp/race.log
            done
          done
          echo 'PASS: both reviewed races reproduced independently for Chrome and Firefox'
      - name: Current persistent-reader regression tests
        run: node tests/helper_repair_check.js
      - name: PiP/background and overlapping cleanup regression
        run: node --expose-gc tests/pip_lifecycle_check.js


  proxy-memory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce lost player priority and verify the previous working caller
        if: github.head_ref == 'codex/browser-proxy-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/Owndot/Kadri/contents/src/080-helper-app.js?ref=2cc7e597b725de8db0356f5ae3ccc6d8fda8e931' --jq .content | base64 --decode > "$RUNNER_TEMP/old-player.js"
          if node tests/player_priority_check.js "$PWD" "$RUNNER_TEMP/old-player.js" > "$RUNNER_TEMP/old-player.log" 2>&1; then echo 'Lost priority not reproduced'; exit 1; fi
          grep -q 'actual player caller lost priority behind background work' "$RUNNER_TEMP/old-player.log"
          gh api 'repos/Owndot/Kadri/contents/src/080-helper-app.js?ref=186b25072223c3a25a62176ae4063e1bef3c6344' --jq .content | base64 --decode > "$RUNNER_TEMP/previous-working-player.js"
          node tests/player_priority_check.js "$PWD" "$RUNNER_TEMP/previous-working-player.js"
          echo 'PASS: actual reviewed caller fails; previous working caller retains priority'
      - name: Reproduce initial-status timeout on the reviewed client
        if: github.head_ref == 'codex/browser-proxy-memory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/initial-status-baseline"
          mkdir -p "$old/src"
          gh api 'repos/Owndot/Kadri/contents/src/080-helper-app.js?ref=0fea61f9999595add670ba232ae91e44a4891201' --jq .content | base64 --decode > "$old/src/080-helper-app.js"
          if node tests/proxy_initial_status_check.js "$old" > "$old/status.log" 2>&1; then echo 'Initial status regression not reproduced'; exit 1; fi
          grep -q 'initial status timeout discarded pulled work' "$old/status.log"
          echo 'PASS: reviewed helper/proxyLoop drops the pulled batch on one status timeout'
      - name: Current transfer, cancellation and player-priority regressions
        run: |
          node tests/proxy_initial_status_check.js
          node tests/proxy_review_check.js
          node tests/player_priority_check.js
      - name: Actual shared proxy client and bounded concurrent responses
        run: node --max-old-space-size=32 --expose-gc tests/proxy_memory_check.js
      - name: Build both unchanged extension targets
        run: node tools/build.js

  dnr-scope:
    # Kadris Schutzregeln gelten nur für Kadris eigene Anfragen, nie für Service Worker fremder Webseiten
    # (Chromium: Mutationsprobe; Firefox: echter Browser vom Runner, Kadri als temporäre Erweiterung).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install playwright==1.56.0 selenium==4.38.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
          firefox --version
          geckodriver --version | head -1
      - name: Bauen (Chromium- und Firefox-Testfassung)
        run: node tools/build.js --test --test-firefox
      - name: Chromium – fremde Service Worker und eigene Anfragen
        run: TESTS="test_dnr_scope.py test_redirect.py test_guard.py" tests/run_all.sh
      - name: Chromium – Mutationsprobe (jede Abschwächung muss auffallen)
        run: cd tests && xvfb-run -a python3 -u dnr_scope_mutation.py
      - name: Firefox – fremde Service Worker und eigene Anfragen
        run: cd tests && python3 -u firefox_dnr_scope.py | tee "$RUNNER_TEMP/ff.log" && ! grep -q '^FAIL' "$RUNNER_TEMP/ff.log" && grep -q '^ERGEBNIS' "$RUNNER_TEMP/ff.log"
      - name: Firefox – Gegenprobe ohne Initiator an der Referer-Regel muss auffallen
        run: |
          set -euo pipefail
          mut="$RUNNER_TEMP/ff-mutant"; rm -rf "$mut"; cp -r dist/test-firefox "$mut"
          python3 - "$mut/background.js" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p, encoding='utf-8').read()
          a = "tabIds: [-1], initiatorDomains: [OWN_HOST] },"
          assert s.count(a) == 1
          open(p, 'w', encoding='utf-8').write(s.replace(a, "tabIds: [-1] },"))
          PY
          cd tests && python3 -u firefox_dnr_scope.py "$mut" | tee "$RUNNER_TEMP/ff-mut.log" || true
          grep -q '^FAIL F5' "$RUNNER_TEMP/ff-mut.log"
          echo 'PASS: Firefox-Test erkennt die Referer-Regel ohne Initiator'

  helper-channel:
    # Isolated test build dist/channel-poc only (authenticated helper channel, dummy data).
    # The helper counterpart is the unchanged, device-tested PocServer of the pinned helper commit,
    # run on a desktop JVM. Nothing here is published; no APK is built.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned helper commit
        id: pin
        run: |
          sha=$(sed -n 's/^helper_commit=\([0-9a-f]\{40\}\)$/\1/p' vendor/kadri-pairing-poc/SOURCE)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Owndot/video-assistent-helper
          ref: ${{ steps.pin.outputs.sha }}
          path: helper
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchains (Rust 1.97.0 from the helper's rust-toolchain.toml, wasm-bindgen-cli 0.2.104)
        run: |
          set -euo pipefail
          (cd helper/poc/pake-channel/core && rustup show active-toolchain && rustc -V)
          cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - name: Rebuild the vendored WASM core from the pinned commit and compare
        run: |
          set -euo pipefail
          bash helper/poc/android-capability/tools/build-wasm-kadri.sh "$RUNNER_TEMP/wasm"
          for f in kadri_pairing_poc.js kadri_pairing_poc_bg.wasm; do cmp "$RUNNER_TEMP/wasm/kadri-wasm/$f" "vendor/kadri-pairing-poc/$f"; done
          test "$(sha256sum < vendor/kadri-pairing-poc/kadri_pairing_poc_bg.wasm | cut -d' ' -f1)" = "$(sed -n 's/^sha256_wasm=//p' vendor/kadri-pairing-poc/SOURCE)"
          test "$(sha256sum < vendor/kadri-pairing-poc/kadri_pairing_poc.js | cut -d' ' -f1)" = "$(sed -n 's/^sha256_js=//p' vendor/kadri-pairing-poc/SOURCE)"
          echo 'PASS: vendored WASM core rebuilt bit-identically from the pinned helper commit'
      - name: Desktop host of the unchanged PocServer
        run: bash helper/poc/android-capability/tools/build-desktop-helper.sh "$RUNNER_TEMP/helper-host"
      - name: Playwright (Chromium)
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Build; normal builds must not contain the channel
        run: |
          set -euo pipefail
          node tools/build.js --test --channel-poc --channel-only
          for d in dist/chrome dist/firefox dist/test; do
            test ! -e "$d/channel" && test ! -e "$d/channel-background.js"
            if grep -rlE 'kadri-channel|wasm_bindgen|47899' "$d"; then echo "channel code in $d"; exit 1; fi
          done
          if unzip -l dist/kadri-chrome-*.zip | grep -qE 'channel|wasm'; then exit 1; fi
          if unzip -l dist/kadri-firefox-*.zip | grep -qE 'channel|wasm'; then exit 1; fi
          echo 'PASS: dist/chrome, dist/firefox, dist/test and both zips contain no channel code'
      - name: Channel integration, browser and mutation tests
        env:
          HELPER_HOST_DIR: ${{ runner.temp }}/helper-host
        run: |
          set -euo pipefail
          node tests/channel/channel_unit_check.js
          node tests/channel/channel_integration_check.js
          node tests/channel/channel_browser_check.js
          CHANNEL_DIST_DIR=dist/channel-only node tests/channel/channel_browser_check.js
          node tests/channel/channel_sandbox_failure_check.js
          node tests/channel/channel_mutation_check.js
