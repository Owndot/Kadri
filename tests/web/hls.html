<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>HLS-Testseite</title>
<script src="hls.min.js"></script></head>
<body style="margin:0"><video id=v muted autoplay playsinline style="width:100%;display:block"></video>

</body></html>
