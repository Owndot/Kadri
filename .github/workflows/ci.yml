name: Bauen und testen
on:
  push:
    branches: [main]
    paths-ignore: ['tests/mess_validation.py', '.github/workflows/performance-validation.yml', '*.md']
  workflow_dispatch:
  pull_request:
    paths-ignore: ['tests/mess_validation.py', '.github/workflows/performance-validation.yml', '*.md']
permissions:
  contents: read
jobs:
  build-test:
    if: github.head_ref != 'codex/pairing-key-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb zip
      - name: Bauen
        run: node tools/build.js --test
      - name: Referrer policy and real HTTP/HTTPS redirects
        run: |
          set -euo pipefail
          node tests/referrer_check.js
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p /tmp/privacy-media
          ffmpeg -v error -y -f lavfi -i testsrc2=size=320x180:rate=24 -t 8 -c:v libx264 -threads 1 -pix_fmt yuv420p -g 48 -movflags +faststart /tmp/privacy-media/clip.mp4
          EXT_DIR="$PWD/dist/test" xvfb-run -a python3 -u tests/privacy_browser.py --kadri
      - name: Prove recovery regression against the broken predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api 'repos/Owndot/Kadri/contents/chrome/background.js?ref=af294d1' --jq .content | base64 --decode > "$RUNNER_TEMP/previous-background.js"
          if timeout 60 node - "$RUNNER_TEMP/previous-background.js" > "$RUNNER_TEMP/previous-recovery.log" 2>&1 <<'JS'
          const fs=require('fs'), run=require('./tests/header_context_check.js');
          run(fs.readFileSync(process.argv[2],'utf8'),{URL,AbortController,setTimeout,clearTimeout})
            .then(()=>{},error=>{console.error(error);process.exitCode=1;});
          JS
          then
            echo 'Broken predecessor unexpectedly passed'; exit 1
          fi
          cat "$RUNNER_TEMP/previous-recovery.log"
          grep -q 'setup failure never recovered' "$RUNNER_TEMP/previous-recovery.log"
          node tests/header_context_check.js
          echo 'PASS: predecessor fails the recovery assertion; current source passes'
      - name: Security lifecycle tests first
        run: TESTS="test_abort.py test_guard.py test_redirect.py test_worker_restart.py" tests/run_all.sh
      - name: Remaining Chromium tests
        shell: bash
        run: |
          export TESTS="$(python3 -c 'import glob,os; print(" ".join(os.path.basename(p) for p in sorted(glob.glob("tests/test_*.py")) if os.path.basename(p) not in {"test_abort.py","test_guard.py","test_redirect.py","test_worker_restart.py"}))')"
          tests/run_all.sh | tee ergebnis.txt
          echo '### Ergebnis' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kadri
          path: |
            dist/kadri-*.zip
            tests/out/*.log

  pairing-recovery:
    if: github.head_ref == 'codex/pairing-key-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cc14bcdfb8a7a7d296c32ab3943c74b291be6ac4
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Chromium test tools only
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          timeout 90 pip install --timeout 30 --retries 1 playwright==1.56.0
          # Run40304715724 spent >11 minutes on Azure mirror downloads.
          # Same signed official Ubuntu archive, already used by Helper validation.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          timeout 240 python -m playwright install --with-deps chromium
          command -v xvfb-run
          command -v zip
      - name: Prove stale-key regression on unchanged main
        run: |
          set -euo pipefail
          node baseline/tools/build.js --test
          if timeout 100 env KADRI_EXT="$PWD/baseline/dist/test" xvfb-run -a python3 -u tests/test_repair.py > /tmp/old-browser.log 2>&1; then echo 'Browser baseline unexpectedly recovered'; exit 1; fi
          grep -q 'existing tab kept stale key after re-pairing' /tmp/old-browser.log
          echo 'PASS: actual old source and old Chromium extension reproduce stale-key failure'
      - name: Fixed adapters and focused real extension checks
        run: |
          set -euo pipefail
          node tests/referrer_check.js
          node tests/header_context_check.js
          node tests/ff_net_check.js firefox/background.js
          node tools/build.js --test
          xvfb-run -a python3 -u tests/test_repair.py
          TESTS="test_repair.py test_helper.py test_proxy.py" tests/run_all.sh

  helper-key-regression:
    # Regular fast guard for every matching PR and main push, independent of branch name.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        if: github.head_ref == 'codex/pairing-key-recovery'
        with:
          ref: 85c0d3c7fa8b3ec75f0f7abba68fbf9a8b2f5796
          path: review-baseline
          persist-credentials: false
      - name: Reproduce both reviewed races on the previous PR head
        if: github.head_ref == 'codex/pairing-key-recovery'
        run: |
          set -euo pipefail
          for target in chrome firefox; do
            for race in event-race initial-race; do
              if node tests/helper_repair_check.js review-baseline --target="$target" --case="$race" > /tmp/race.log 2>&1; then echo 'Reviewed race not reproduced'; exit 1; fi
              grep -Eq 'request before storage event used stale key|initialization lost storage change' /tmp/race.log
            done
          done
          echo 'PASS: both reviewed races reproduced independently for Chrome and Firefox'
      - name: Current persistent-reader regression tests
        run: node tests/helper_repair_check.js
