name: P4 isolated test extension (Kadri P4 TEST, owner-approved Samsung test only)

# Vom Eigentümer freigegebener Weg („Kadri P4c – Samsung-Test ohne Mac und ohne dauerhaften Signierschlüssel“): das
# entpackte Testpaket „Kadri P4 TEST“ (ID pcccpjllneffccpenbepmfbkjedllkkf) für den kontrollierten Gerätetest mit der
# Test-App de.evp.helfer.p4test. Keine Produktionsfreigabe, kein Store, kein Release; Produktion bleibt UNAPPROVED.
# Gegenüber dist/chrome unterscheiden sich nur Name, Beschreibung und der feste ÖFFENTLICHE Schlüssel
# (tools/p4test/identity.json) – kein privater Schlüssel existiert oder wird gebraucht.
#
# Drei getrennte Herkünfte (Codex Release-Readiness P2):
#   SOURCE_SHA            Kadri-Quelle, aus der das Paket gebaut wird.
#   HELPER_SHA            Anwendungscode der gepaarten P4-Test-App; deren echter ChannelServer ist die Gegenstelle des
#                         Kanaltests mit genau dem ausgelieferten Paket.
#   WASM_CORE_ORIGIN_SHA  Helper-Commit, aus dem der vendorte WASM-Kern stammt (vendor/kadri-pairing-poc/SOURCE); er
#                         wird daraus bitgenau neu gebaut und verglichen. Er wird NICHT auf HELPER_SHA umetikettiert.
# Nach SOURCE_SHA dürfen sich nur Liefer-/Prüfwerkzeuge und Root-Markdown ändern (nichts davon geht ins Paket).
# Hochgeladen erst, wenn die normale CI auf SOURCE_SHA grün ist.
#
# FREIGABESPERRE (Codex Release-Readiness P1): standardmäßig geschlossen (DELIVERY_APPROVAL: 'none'). Der Job "gate"
# entscheidet ohne Checkout (tools/delivery/lock.py, wörtlich eingebettet): geliefert wird nur bei einer einmaligen,
# an SOURCE_SHA, HELPER_SHA und WASM_CORE_ORIGIN_SHA gebundenen Freigabe, die genau der auslösende Push einführt
# (Commit-Nachricht "Delivery-Approval: <ID>", höchstens 72 h gültig, ID unverbraucht, kein Re-Run). Doku-Commits,
# Pin-Korrekturen und spätere Pushes erben eine Freigabe nie. Der Paket-Job prüft die Sperre vor jedem Checkout erneut.
# Öffentliches Actions-Artefakt mit 2 Tagen Aufbewahrung (Repository ist öffentlich).
on:
  push:
    branches: [feature/c3-helper-mp4]
    paths: [.github/workflows/p4-test-extension.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p4-test-extension
  cancel-in-progress: false
env:
  # Freigabesperre: 'none' = gesperrt. Nur der Eigentümer trägt hier eine Freigabe ein (Format in tools/delivery/lock.py).
  DELIVERY_APPROVAL: 'none'
  SOURCE_SHA: 7978a41232c3b1582289c53461da4fe63ad28ff9
  HELPER_SHA: 546af144fe2c2efa00c9c93b745c695f6077dbaa
  WASM_CORE_ORIGIN_SHA: bd5ab293bbc6729cabafe72b6bd5606f8c74f5e5
  P4_ID: pcccpjllneffccpenbepmfbkjedllkkf
  HELPER_PACKAGE: de.evp.helfer.p4test
  RETENTION_DAYS: 2
jobs:
  # Entscheidung ohne Checkout; ohne gültige Freigabe wird der Paket-Job übersprungen (nichts gebaut oder geladen).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.lock.outputs.go }}
      approval_id: ${{ steps.lock.outputs.approval_id }}
    steps:
    - id: lock
      name: Delivery lock (closed unless a new, bound, unused owner approval is introduced by this push)
      env:
        GH_TOKEN: ${{ github.token }}
        LOCK_BIND: SOURCE_SHA HELPER_SHA WASM_CORE_ORIGIN_SHA
        LOCK_BRANCH: feature/c3-helper-mp4
        LOCK_WORKFLOW: .github/workflows/p4-test-extension.yml
        LOCK_SCOPE: kadri-p4test
        LOCK_ENVIRONMENT: p4-delivery
        LOCK_REVIEWERS: ''   # festgelegte Reviewer-Identität(en), nur der Eigentümer trägt sie ein (leer = gesperrt)
      run: |
        set -euo pipefail
        python3 -I - <<'LOCKPY'
        #!/usr/bin/env python3
        """Freigabesperre für Testlieferungen (Codex Release-Readiness P1). Läuft im Workflow VOR jedem Checkout.

        Diese Datei ist die maßgebliche Kopie. Der Job "gate" der Lieferworkflows enthält sie wörtlich als Inline-Skript
        (tests/delivery/test_lock.py prüft die Byte-Gleichheit und die Workflow-Struktur). Helper und Kadri nutzen dieselbe Datei.

        Standard: gesperrt. DELIVERY_APPROVAL: 'none' -> go=no, nichts wird ausgecheckt, gebaut, signiert oder hochgeladen.

        Eine Freigabe ist genau ein Wert der env-Variable DELIVERY_APPROVAL in der Workflowdatei, in einfachen Anführungszeichen:
            SOURCE_SHA=<40hex>;<PAAR>=<40hex>[;...];SCOPE=<Lieferumfang>;ID=<id>;UNTIL=<YYYY-MM-DDTHH:MMZ>
        Die Schlüssel sind genau die in LOCK_BIND genannten Pins plus SCOPE (= LOCK_SCOPE, der Lieferumfang), ID und UNTIL. Jeder Wert muss dem Pin derselben
        Workflowdatei gleichen. Wer einen Pin ändert, ohne die Freigabe neu zu erteilen, sperrt damit die Lieferung.

        Die Freigabe gilt nur einmal und nur für den Push, der sie einführt:
          * Ereignis push auf genau LOCK_BRANCH, erster Versuch (keine Wiederholung eines Laufs), Auslöser = Repo-Eigentümer;
          * der Kopf-Commit dieses Pushes trägt die Zeile "Delivery-Approval: <ID>" in der Commit-Nachricht;
          * am Stand vor dem Push (event.before) stand ein anderer DELIVERY_APPROVAL-Wert. Ein späterer Doku-Commit, eine
            Pin-Korrektur oder ein anderer Push erbt die Zeile unverändert und wird deshalb abgewiesen;
          * kein anderer Lauf dieses Workflows (irgendein Branch, irgendein Ergebnis) trägt dieselbe ID oder denselben Commit.
            Eine benutzte ID ist verbraucht, auch wenn die Lieferung danach scheiterte – GRENZE (Codex NO-GO 3): geprüft wird
            die Actions-Historie; wer Läufe löschen kann (Repo-Admin, auch ein Agent mit Adminrechten), kann eine ID wieder
            "frei" machen. Dauerhafte Einmaligkeit ist damit NICHT gewährleistet; Vorschlag einer gegen Agentenänderungen
            geschützten Verbrauchsregistrierung: P4-APPROVAL-PROPOSAL.md (nicht umgesetzt, nicht aktiviert);
          * UNTIL liegt in der Zukunft und höchstens 72 Stunden entfernt.
          * das GitHub-Environment LOCK_ENVIRONMENT existiert, Administratoren dürfen es NICHT umgehen (can_admins_bypass
            false), "Prevent self-review" ist an, die Required Reviewers sind GENAU die im Workflow festgelegten Benutzer
            (LOCK_REVIEWERS, nur Benutzer, keine Teams) und keiner davon ist der Auslöser/Eigentümer. "Irgendein Reviewer" genügt
            nicht (Codex NO-GO 3);
          * nur im Paketjob (LOCK_REQUIRE_GO=1): für DIESEN Lauf liegt eine Zustimmung ("approved") eines festgelegten Reviewers
            (≠ Auslöser) für LOCK_ENVIRONMENT vor und keine Ablehnung – eine Umgehung ohne Zustimmung sperrt.
        Diese Prüfungen belegen nur die EINRICHTUNG und die ZUSTIMMUNG einer anderen GitHub-Identität. Dass hinter ihr ein
        unabhängiger Mensch steht, dessen Zugang kein Agent besitzt, kann kein Workflow prüfen (Pflicht des Eigentümers, siehe
        P4-APPROVAL-PROPOSAL.md).
        Jede nicht prüfbare Bedingung (API-Fehler, fehlende Ereignisdaten) zählt als nicht erfüllt (fail closed).

        Codex Release-Readiness 2: Dieselbe Prüfung läuft im Paketjob erneut (LOCK_REQUIRE_GO=1) – vor dem Checkout, vor dem
        Signieren und vor dem Upload. Ein Re-Run eines fehlgeschlagenen Paketjobs (GITHUB_RUN_ATTEMPT > 1, Gate-Ausgabe
        wiederverwendet), eine inzwischen abgelaufene Freigabe oder eine anderweitig verbrauchte ID sperren dort fail closed.

        Exit 0 mit go=no: gesperrt (Normalzustand). Exit 0 mit go=yes: freigegeben.
        Exit 1 mit go=no: Freigabe eingetragen, aber ungültig (sichtbar roter Lauf).
        """
        import base64
        import datetime
        import json
        import os
        import re
        import subprocess
        import sys

        APPROVAL_LINE = re.compile(r"^\s*DELIVERY_APPROVAL:\s*'([^'\n]*)'\s*(#.*)?$", re.M)
        HEX40 = re.compile(r'^[0-9a-f]{40}$')
        ID_RE = re.compile(r'^[a-z0-9][a-z0-9-]{7,39}$')
        UNTIL_RE = re.compile(r'^\d{4}-\d\d-\d\dT\d\d:\d\dZ$')
        MAX_VALIDITY = datetime.timedelta(hours=72)
        CLOSED = ('', 'none')


        def approval_in(text):
            """DELIVERY_APPROVAL-Wert einer Workflowdatei; None, wenn die Datei fehlt; ValueError bei mehrdeutiger Datei."""
            if text is None:
                return None
            found = [m.group(1) for m in APPROVAL_LINE.finditer(text)]
            if len(found) != 1:
                raise ValueError('expected exactly one DELIVERY_APPROVAL line, found %d' % len(found))
            return found[0]


        def parse(value, bind):
            """'K=V;K=V' -> dict; Schlüssel genau bind + ID + UNTIL, keine Dubletten."""
            out = {}
            for part in value.split(';'):
                if '=' not in part:
                    raise ValueError('malformed approval part %r' % part)
                k, v = part.split('=', 1)
                if k in out:
                    raise ValueError('duplicate approval key %s' % k)
                out[k] = v
            want = set(bind) | {'SCOPE', 'ID', 'UNTIL'}
            if set(out) != want:
                raise ValueError('approval keys %s, expected %s' % (sorted(out), sorted(want)))
            return out


        def protected(env_info, expected, actor):
            """Environment-Antwort der GitHub-API -> (geschützt, Grund). Codex NO-GO 3: Required Reviewers allein genügen nicht.
            Verlangt: keine Admin-Umgehung, Prevent self-review an, Reviewer = genau die festgelegten Benutzer, Auslöser keiner davon."""
            env_info = env_info or {}
            rules = [r for r in env_info.get('protection_rules') or [] if r.get('type') == 'required_reviewers']
            if len(rules) != 1:
                return False, 'environment has no (or more than one) required reviewers rule'
            rule = rules[0]
            reviewers = rule.get('reviewers') or []
            if not reviewers:
                return False, 'environment has no required reviewers'
            if env_info.get('can_admins_bypass') is not False:
                return False, 'administrators may bypass the environment protection (can_admins_bypass %s)' % env_info.get('can_admins_bypass')
            if rule.get('prevent_self_review') is not True:
                return False, 'prevent self-review is not enabled (%s)' % rule.get('prevent_self_review')
            if any(r.get('type') != 'User' for r in reviewers):
                return False, 'reviewers must be individual users (team membership of an approver is not provable)'
            logins = [(r.get('reviewer') or {}).get('login') for r in reviewers]
            if not expected:
                return False, 'no reviewer identity pinned in the workflow (LOCK_REVIEWERS)'
            if sorted(set(logins)) != sorted(set(expected)) or len(logins) != len(set(logins)):
                return False, 'reviewers %s are not exactly the pinned reviewers %s' % (sorted(logins), sorted(expected))
            if actor and actor in logins:
                return False, 'the triggering owner %s is a reviewer (no second identity)' % actor
            return True, 'reviewers %s (pinned), no admin bypass, self-review prevented' % sorted(logins)


        def reviewed(records, ctx):
            """Zustimmungen des Laufs (GET actions/runs/<id>/approvals) -> (zugestimmt, Grund)."""
            env = ctx['environment']
            mine = [a for a in records or [] if env in [e.get('name') for e in a.get('environments') or []]]
            if any(a.get('state') != 'approved' for a in mine):
                return False, 'a review of this run for %s is not "approved"' % env
            ok = [a for a in mine if a.get('state') == 'approved'
                  and (a.get('user') or {}).get('login') in ctx.get('reviewers', [])
                  and (a.get('user') or {}).get('login') != ctx['actor']]
            if not ok:
                return False, 'no approval of this run for %s by a pinned reviewer other than %s' % (env, ctx['actor'] or '(missing)')
            return True, 'approved by %s' % ok[0]['user']['login']


        def decide(ctx, fetch_workflow_at, list_runs, now, fetch_environment=None, fetch_approvals=None):
            """-> (go, reasons, approval_id). Reine Funktion; fetch_workflow_at/list_runs dürfen Ausnahmen werfen."""
            value = ctx['approval']
            if value in CLOSED:
                return False, ['delivery lock closed (DELIVERY_APPROVAL none)'], None
            reasons = []
            try:
                a = parse(value, ctx['bind'])
            except ValueError as e:
                return False, ['approval unreadable: %s' % e], None
            aid = a['ID']
            if not ID_RE.match(aid):
                reasons.append('approval ID %r has the wrong form' % aid)
            for name in ctx['bind']:
                pin = ctx['pins'].get(name, '')
                if not HEX40.match(a[name]):
                    reasons.append('approved %s is not a full commit SHA' % name)
                elif a[name] != pin:
                    reasons.append('approved %s %s differs from the pinned %s' % (name, a[name], pin or '(missing)'))
            if a['SCOPE'] != ctx.get('scope'):
                reasons.append('approval scope %r is not this delivery (%r)' % (a['SCOPE'], ctx.get('scope')))
            if not UNTIL_RE.match(a['UNTIL']):
                reasons.append('UNTIL %r has the wrong form' % a['UNTIL'])
            else:
                until = datetime.datetime.strptime(a['UNTIL'], '%Y-%m-%dT%H:%MZ').replace(tzinfo=datetime.timezone.utc)
                if until <= now:
                    reasons.append('approval expired at %s' % a['UNTIL'])
                elif until - now > MAX_VALIDITY:
                    reasons.append('approval valid for more than 72 hours (until %s)' % a['UNTIL'])
            if ctx['event_name'] != 'push':
                reasons.append('event %s (only the push that introduces the approval may deliver)' % ctx['event_name'])
            if ctx['ref'] != 'refs/heads/' + ctx['branch']:
                reasons.append('ref %s is not refs/heads/%s' % (ctx['ref'], ctx['branch']))
            if ctx['run_attempt'] != '1':
                reasons.append('run attempt %s (a re-run never delivers again)' % ctx['run_attempt'])
            if not ctx['actor'] or ctx['actor'] != ctx['owner']:
                reasons.append('actor %s is not the repository owner' % (ctx['actor'] or '(missing)'))
            if ctx['head_id'] != ctx['sha']:
                reasons.append('head commit %s is not the workflow commit %s' % (ctx['head_id'] or '(missing)', ctx['sha']))
            marker = 'Delivery-Approval: ' + aid
            if marker not in (ctx['head_message'] or '').splitlines():
                reasons.append('head commit message lacks the line "%s"' % marker)
            before = ctx['before'] or ''
            if not HEX40.match(before) or before == '0' * 40:
                reasons.append('no previous branch state to compare (before=%s)' % (before or '(missing)'))
            else:
                try:
                    prev = approval_in(fetch_workflow_at(before))
                except Exception as e:  # fail closed
                    reasons.append('cannot read the previous approval at %s: %s' % (before, e))
                else:
                    if prev == value:
                        reasons.append('approval not introduced by this push (already present at %s)' % before)
            if not ctx.get('environment'):
                reasons.append('no protected environment configured for the package job')
            else:
                try:
                    ok, why = protected(fetch_environment(ctx['environment']) if fetch_environment else None, ctx.get('reviewers') or [], ctx['actor'])
                except Exception as e:  # fail closed
                    ok, why = False, 'cannot read environment %s: %s' % (ctx['environment'], e)
                if not ok:
                    reasons.append('environment %s not protected: %s' % (ctx['environment'], why))
                if ctx.get('require_review'):
                    try:
                        rok, rwhy = reviewed(fetch_approvals() if fetch_approvals else None, ctx)
                    except Exception as e:  # fail closed
                        rok, rwhy = False, 'cannot read the approvals of this run: %s' % e
                    if not rok:
                        reasons.append('package stage without the reviewer approval: %s' % rwhy)
            try:
                runs = list_runs()
            except Exception as e:  # fail closed
                reasons.append('cannot list earlier runs of this workflow: %s' % e)
            else:
                for r in runs:
                    if str(r.get('id')) == str(ctx['run_id']):
                        continue
                    if marker in (r.get('message') or '').splitlines():
                        reasons.append('approval ID %s already used by run %s' % (aid, r.get('id')))
                    if r.get('head_sha') == ctx['sha']:
                        reasons.append('commit %s already ran this workflow in run %s' % (ctx['sha'], r.get('id')))
            return (not reasons), reasons, aid


        def gh_json(path):
            p = subprocess.run(['gh', 'api', '-H', 'Accept: application/vnd.github+json', path],
                               capture_output=True, text=True, timeout=120)
            if p.returncode != 0:
                raise RuntimeError('gh api %s failed: %s' % (path.split('?')[0], (p.stderr or '').strip()[:200]))
            return json.loads(p.stdout)


        def main():
            env = os.environ
            repo = env['GITHUB_REPOSITORY']
            wf = env['LOCK_WORKFLOW']
            bind = env['LOCK_BIND'].split()
            event = {}
            if env.get('GITHUB_EVENT_PATH') and os.path.exists(env['GITHUB_EVENT_PATH']):
                event = json.load(open(env['GITHUB_EVENT_PATH']))
            head = event.get('head_commit') or {}
            ctx = {
                'approval': env.get('DELIVERY_APPROVAL', ''), 'bind': bind, 'pins': {n: env.get(n, '') for n in bind},
                'event_name': env.get('GITHUB_EVENT_NAME', ''), 'ref': env.get('GITHUB_REF', ''), 'branch': env['LOCK_BRANCH'],
                'sha': env.get('GITHUB_SHA', ''), 'before': event.get('before', ''), 'run_attempt': env.get('GITHUB_RUN_ATTEMPT', ''),
                'run_id': env.get('GITHUB_RUN_ID', ''), 'actor': env.get('GITHUB_ACTOR', ''),
                'owner': env.get('GITHUB_REPOSITORY_OWNER', ''), 'head_id': head.get('id', ''), 'head_message': head.get('message', ''),
                'scope': env.get('LOCK_SCOPE', ''), 'environment': env.get('LOCK_ENVIRONMENT', ''),
                'reviewers': env.get('LOCK_REVIEWERS', '').split(), 'stage': env.get('LOCK_STAGE', 'gate'),
                'require_review': env.get('LOCK_REQUIRE_GO') == '1',
            }

            def fetch_workflow_at(sha):
                p = subprocess.run(['gh', 'api', 'repos/%s/contents/%s?ref=%s' % (repo, wf, sha)],
                                   capture_output=True, text=True, timeout=120)
                if p.returncode != 0:
                    if 'HTTP 404' in (p.stderr or ''):
                        return None
                    raise RuntimeError((p.stderr or '').strip()[:200])
                return base64.b64decode(json.loads(p.stdout)['content']).decode('utf-8')

            def list_runs():
                out, name = [], os.path.basename(wf)
                for page in range(1, 31):
                    batch = gh_json('repos/%s/actions/workflows/%s/runs?per_page=100&page=%d' % (repo, name, page))['workflow_runs']
                    out += [{'id': r['id'], 'head_sha': r['head_sha'], 'message': (r.get('head_commit') or {}).get('message', '')}
                            for r in batch]
                    if len(batch) < 100:
                        return out
                raise RuntimeError('more than 3000 runs: cannot prove the approval is unused')

            def fetch_environment(name):
                return gh_json('repos/%s/environments/%s' % (repo, name))

            def fetch_approvals():
                return gh_json('repos/%s/actions/runs/%s/approvals' % (repo, ctx['run_id']))

            now = datetime.datetime.now(datetime.timezone.utc)
            go, reasons, aid = decide(ctx, fetch_workflow_at, list_runs, now, fetch_environment, fetch_approvals)
            for r in reasons:
                print('DELIVERY_LOCK ' + r)
            print('DELIVERY_LOCK stage=%s verdict=%s approval_id=%s pins=%s' % (env.get('LOCK_STAGE', 'gate'), 'GO' if go else 'LOCKED', aid or '-',
                                                                       ' '.join('%s=%s' % (n, ctx['pins'][n]) for n in bind)))
            if env.get('GITHUB_OUTPUT'):
                with open(env['GITHUB_OUTPUT'], 'a') as f:
                    f.write('go=%s\napproval_id=%s\n' % ('yes' if go else 'no', aid if go else ''))
            if env.get('LOCK_REQUIRE_GO') == '1' and not go:
                sys.exit(1)   # Paketjob: ohne gültige Freigabe JETZT kein Schritt weiter (auch nach Re-Run oder Ablauf)
            sys.exit(0 if go or ctx['approval'] in CLOSED else 1)


        if __name__ == '__main__':
            main()
        LOCKPY
  package:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    # Menschliche Zustimmung: GitHub hält den Job an, bis ein Required Reviewer dieses Environments zustimmt.
    # Codex NO-GO 3: Der Lock prüft an jeder Lock-Stufe des Paketjobs zusätzlich, dass die Reviewer GENAU LOCK_REVIEWERS sind (nicht der
    # Auslöser), keine Admin-Umgehung erlaubt ist, Prevent self-review an ist und für DIESEN Lauf eine Zustimmung vorliegt.
    # Dass hinter der Reviewer-Identität ein Mensch ohne Agentenzugang steht, kann kein Workflow prüfen (Eigentümerpflicht).
    environment: p4-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Delivery lock re-run in the package job before checkout (re-run, expiry, single use, protection)
      env:
        GH_TOKEN: ${{ github.token }}
        GO: ${{ needs.gate.outputs.go }}
        APPROVAL_ID: ${{ needs.gate.outputs.approval_id }}
        LOCK_BIND: SOURCE_SHA HELPER_SHA WASM_CORE_ORIGIN_SHA
        LOCK_BRANCH: feature/c3-helper-mp4
        LOCK_WORKFLOW: .github/workflows/p4-test-extension.yml
        LOCK_SCOPE: kadri-p4test
        LOCK_ENVIRONMENT: p4-delivery
        LOCK_REVIEWERS: ''   # festgelegte Reviewer-Identität(en), nur der Eigentümer trägt sie ein (leer = gesperrt)
        LOCK_REQUIRE_GO: "1"
        LOCK_STAGE: package-start
      run: |
        # DELIVERY_LOCK_RECHECK
        set -euo pipefail
        [ "$GO" = yes ] || { echo "delivery lock closed: nothing is built or uploaded" >&2; exit 1; }
        cat > "$RUNNER_TEMP/delivery_lock.py" <<'LOCKPY'
        #!/usr/bin/env python3
        """Freigabesperre für Testlieferungen (Codex Release-Readiness P1). Läuft im Workflow VOR jedem Checkout.

        Diese Datei ist die maßgebliche Kopie. Der Job "gate" der Lieferworkflows enthält sie wörtlich als Inline-Skript
        (tests/delivery/test_lock.py prüft die Byte-Gleichheit und die Workflow-Struktur). Helper und Kadri nutzen dieselbe Datei.

        Standard: gesperrt. DELIVERY_APPROVAL: 'none' -> go=no, nichts wird ausgecheckt, gebaut, signiert oder hochgeladen.

        Eine Freigabe ist genau ein Wert der env-Variable DELIVERY_APPROVAL in der Workflowdatei, in einfachen Anführungszeichen:
            SOURCE_SHA=<40hex>;<PAAR>=<40hex>[;...];SCOPE=<Lieferumfang>;ID=<id>;UNTIL=<YYYY-MM-DDTHH:MMZ>
        Die Schlüssel sind genau die in LOCK_BIND genannten Pins plus SCOPE (= LOCK_SCOPE, der Lieferumfang), ID und UNTIL. Jeder Wert muss dem Pin derselben
        Workflowdatei gleichen. Wer einen Pin ändert, ohne die Freigabe neu zu erteilen, sperrt damit die Lieferung.

        Die Freigabe gilt nur einmal und nur für den Push, der sie einführt:
          * Ereignis push auf genau LOCK_BRANCH, erster Versuch (keine Wiederholung eines Laufs), Auslöser = Repo-Eigentümer;
          * der Kopf-Commit dieses Pushes trägt die Zeile "Delivery-Approval: <ID>" in der Commit-Nachricht;
          * am Stand vor dem Push (event.before) stand ein anderer DELIVERY_APPROVAL-Wert. Ein späterer Doku-Commit, eine
            Pin-Korrektur oder ein anderer Push erbt die Zeile unverändert und wird deshalb abgewiesen;
          * kein anderer Lauf dieses Workflows (irgendein Branch, irgendein Ergebnis) trägt dieselbe ID oder denselben Commit.
            Eine benutzte ID ist verbraucht, auch wenn die Lieferung danach scheiterte – GRENZE (Codex NO-GO 3): geprüft wird
            die Actions-Historie; wer Läufe löschen kann (Repo-Admin, auch ein Agent mit Adminrechten), kann eine ID wieder
            "frei" machen. Dauerhafte Einmaligkeit ist damit NICHT gewährleistet; Vorschlag einer gegen Agentenänderungen
            geschützten Verbrauchsregistrierung: P4-APPROVAL-PROPOSAL.md (nicht umgesetzt, nicht aktiviert);
          * UNTIL liegt in der Zukunft und höchstens 72 Stunden entfernt.
          * das GitHub-Environment LOCK_ENVIRONMENT existiert, Administratoren dürfen es NICHT umgehen (can_admins_bypass
            false), "Prevent self-review" ist an, die Required Reviewers sind GENAU die im Workflow festgelegten Benutzer
            (LOCK_REVIEWERS, nur Benutzer, keine Teams) und keiner davon ist der Auslöser/Eigentümer. "Irgendein Reviewer" genügt
            nicht (Codex NO-GO 3);
          * nur im Paketjob (LOCK_REQUIRE_GO=1): für DIESEN Lauf liegt eine Zustimmung ("approved") eines festgelegten Reviewers
            (≠ Auslöser) für LOCK_ENVIRONMENT vor und keine Ablehnung – eine Umgehung ohne Zustimmung sperrt.
        Diese Prüfungen belegen nur die EINRICHTUNG und die ZUSTIMMUNG einer anderen GitHub-Identität. Dass hinter ihr ein
        unabhängiger Mensch steht, dessen Zugang kein Agent besitzt, kann kein Workflow prüfen (Pflicht des Eigentümers, siehe
        P4-APPROVAL-PROPOSAL.md).
        Jede nicht prüfbare Bedingung (API-Fehler, fehlende Ereignisdaten) zählt als nicht erfüllt (fail closed).

        Codex Release-Readiness 2: Dieselbe Prüfung läuft im Paketjob erneut (LOCK_REQUIRE_GO=1) – vor dem Checkout, vor dem
        Signieren und vor dem Upload. Ein Re-Run eines fehlgeschlagenen Paketjobs (GITHUB_RUN_ATTEMPT > 1, Gate-Ausgabe
        wiederverwendet), eine inzwischen abgelaufene Freigabe oder eine anderweitig verbrauchte ID sperren dort fail closed.

        Exit 0 mit go=no: gesperrt (Normalzustand). Exit 0 mit go=yes: freigegeben.
        Exit 1 mit go=no: Freigabe eingetragen, aber ungültig (sichtbar roter Lauf).
        """
        import base64
        import datetime
        import json
        import os
        import re
        import subprocess
        import sys

        APPROVAL_LINE = re.compile(r"^\s*DELIVERY_APPROVAL:\s*'([^'\n]*)'\s*(#.*)?$", re.M)
        HEX40 = re.compile(r'^[0-9a-f]{40}$')
        ID_RE = re.compile(r'^[a-z0-9][a-z0-9-]{7,39}$')
        UNTIL_RE = re.compile(r'^\d{4}-\d\d-\d\dT\d\d:\d\dZ$')
        MAX_VALIDITY = datetime.timedelta(hours=72)
        CLOSED = ('', 'none')


        def approval_in(text):
            """DELIVERY_APPROVAL-Wert einer Workflowdatei; None, wenn die Datei fehlt; ValueError bei mehrdeutiger Datei."""
            if text is None:
                return None
            found = [m.group(1) for m in APPROVAL_LINE.finditer(text)]
            if len(found) != 1:
                raise ValueError('expected exactly one DELIVERY_APPROVAL line, found %d' % len(found))
            return found[0]


        def parse(value, bind):
            """'K=V;K=V' -> dict; Schlüssel genau bind + ID + UNTIL, keine Dubletten."""
            out = {}
            for part in value.split(';'):
                if '=' not in part:
                    raise ValueError('malformed approval part %r' % part)
                k, v = part.split('=', 1)
                if k in out:
                    raise ValueError('duplicate approval key %s' % k)
                out[k] = v
            want = set(bind) | {'SCOPE', 'ID', 'UNTIL'}
            if set(out) != want:
                raise ValueError('approval keys %s, expected %s' % (sorted(out), sorted(want)))
            return out


        def protected(env_info, expected, actor):
            """Environment-Antwort der GitHub-API -> (geschützt, Grund). Codex NO-GO 3: Required Reviewers allein genügen nicht.
            Verlangt: keine Admin-Umgehung, Prevent self-review an, Reviewer = genau die festgelegten Benutzer, Auslöser keiner davon."""
            env_info = env_info or {}
            rules = [r for r in env_info.get('protection_rules') or [] if r.get('type') == 'required_reviewers']
            if len(rules) != 1:
                return False, 'environment has no (or more than one) required reviewers rule'
            rule = rules[0]
            reviewers = rule.get('reviewers') or []
            if not reviewers:
                return False, 'environment has no required reviewers'
            if env_info.get('can_admins_bypass') is not False:
                return False, 'administrators may bypass the environment protection (can_admins_bypass %s)' % env_info.get('can_admins_bypass')
            if rule.get('prevent_self_review') is not True:
                return False, 'prevent self-review is not enabled (%s)' % rule.get('prevent_self_review')
            if any(r.get('type') != 'User' for r in reviewers):
                return False, 'reviewers must be individual users (team membership of an approver is not provable)'
            logins = [(r.get('reviewer') or {}).get('login') for r in reviewers]
            if not expected:
                return False, 'no reviewer identity pinned in the workflow (LOCK_REVIEWERS)'
            if sorted(set(logins)) != sorted(set(expected)) or len(logins) != len(set(logins)):
                return False, 'reviewers %s are not exactly the pinned reviewers %s' % (sorted(logins), sorted(expected))
            if actor and actor in logins:
                return False, 'the triggering owner %s is a reviewer (no second identity)' % actor
            return True, 'reviewers %s (pinned), no admin bypass, self-review prevented' % sorted(logins)


        def reviewed(records, ctx):
            """Zustimmungen des Laufs (GET actions/runs/<id>/approvals) -> (zugestimmt, Grund)."""
            env = ctx['environment']
            mine = [a for a in records or [] if env in [e.get('name') for e in a.get('environments') or []]]
            if any(a.get('state') != 'approved' for a in mine):
                return False, 'a review of this run for %s is not "approved"' % env
            ok = [a for a in mine if a.get('state') == 'approved'
                  and (a.get('user') or {}).get('login') in ctx.get('reviewers', [])
                  and (a.get('user') or {}).get('login') != ctx['actor']]
            if not ok:
                return False, 'no approval of this run for %s by a pinned reviewer other than %s' % (env, ctx['actor'] or '(missing)')
            return True, 'approved by %s' % ok[0]['user']['login']


        def decide(ctx, fetch_workflow_at, list_runs, now, fetch_environment=None, fetch_approvals=None):
            """-> (go, reasons, approval_id). Reine Funktion; fetch_workflow_at/list_runs dürfen Ausnahmen werfen."""
            value = ctx['approval']
            if value in CLOSED:
                return False, ['delivery lock closed (DELIVERY_APPROVAL none)'], None
            reasons = []
            try:
                a = parse(value, ctx['bind'])
            except ValueError as e:
                return False, ['approval unreadable: %s' % e], None
            aid = a['ID']
            if not ID_RE.match(aid):
                reasons.append('approval ID %r has the wrong form' % aid)
            for name in ctx['bind']:
                pin = ctx['pins'].get(name, '')
                if not HEX40.match(a[name]):
                    reasons.append('approved %s is not a full commit SHA' % name)
                elif a[name] != pin:
                    reasons.append('approved %s %s differs from the pinned %s' % (name, a[name], pin or '(missing)'))
            if a['SCOPE'] != ctx.get('scope'):
                reasons.append('approval scope %r is not this delivery (%r)' % (a['SCOPE'], ctx.get('scope')))
            if not UNTIL_RE.match(a['UNTIL']):
                reasons.append('UNTIL %r has the wrong form' % a['UNTIL'])
            else:
                until = datetime.datetime.strptime(a['UNTIL'], '%Y-%m-%dT%H:%MZ').replace(tzinfo=datetime.timezone.utc)
                if until <= now:
                    reasons.append('approval expired at %s' % a['UNTIL'])
                elif until - now > MAX_VALIDITY:
                    reasons.append('approval valid for more than 72 hours (until %s)' % a['UNTIL'])
            if ctx['event_name'] != 'push':
                reasons.append('event %s (only the push that introduces the approval may deliver)' % ctx['event_name'])
            if ctx['ref'] != 'refs/heads/' + ctx['branch']:
                reasons.append('ref %s is not refs/heads/%s' % (ctx['ref'], ctx['branch']))
            if ctx['run_attempt'] != '1':
                reasons.append('run attempt %s (a re-run never delivers again)' % ctx['run_attempt'])
            if not ctx['actor'] or ctx['actor'] != ctx['owner']:
                reasons.append('actor %s is not the repository owner' % (ctx['actor'] or '(missing)'))
            if ctx['head_id'] != ctx['sha']:
                reasons.append('head commit %s is not the workflow commit %s' % (ctx['head_id'] or '(missing)', ctx['sha']))
            marker = 'Delivery-Approval: ' + aid
            if marker not in (ctx['head_message'] or '').splitlines():
                reasons.append('head commit message lacks the line "%s"' % marker)
            before = ctx['before'] or ''
            if not HEX40.match(before) or before == '0' * 40:
                reasons.append('no previous branch state to compare (before=%s)' % (before or '(missing)'))
            else:
                try:
                    prev = approval_in(fetch_workflow_at(before))
                except Exception as e:  # fail closed
                    reasons.append('cannot read the previous approval at %s: %s' % (before, e))
                else:
                    if prev == value:
                        reasons.append('approval not introduced by this push (already present at %s)' % before)
            if not ctx.get('environment'):
                reasons.append('no protected environment configured for the package job')
            else:
                try:
                    ok, why = protected(fetch_environment(ctx['environment']) if fetch_environment else None, ctx.get('reviewers') or [], ctx['actor'])
                except Exception as e:  # fail closed
                    ok, why = False, 'cannot read environment %s: %s' % (ctx['environment'], e)
                if not ok:
                    reasons.append('environment %s not protected: %s' % (ctx['environment'], why))
                if ctx.get('require_review'):
                    try:
                        rok, rwhy = reviewed(fetch_approvals() if fetch_approvals else None, ctx)
                    except Exception as e:  # fail closed
                        rok, rwhy = False, 'cannot read the approvals of this run: %s' % e
                    if not rok:
                        reasons.append('package stage without the reviewer approval: %s' % rwhy)
            try:
                runs = list_runs()
            except Exception as e:  # fail closed
                reasons.append('cannot list earlier runs of this workflow: %s' % e)
            else:
                for r in runs:
                    if str(r.get('id')) == str(ctx['run_id']):
                        continue
                    if marker in (r.get('message') or '').splitlines():
                        reasons.append('approval ID %s already used by run %s' % (aid, r.get('id')))
                    if r.get('head_sha') == ctx['sha']:
                        reasons.append('commit %s already ran this workflow in run %s' % (ctx['sha'], r.get('id')))
            return (not reasons), reasons, aid


        def gh_json(path):
            p = subprocess.run(['gh', 'api', '-H', 'Accept: application/vnd.github+json', path],
                               capture_output=True, text=True, timeout=120)
            if p.returncode != 0:
                raise RuntimeError('gh api %s failed: %s' % (path.split('?')[0], (p.stderr or '').strip()[:200]))
            return json.loads(p.stdout)


        def main():
            env = os.environ
            repo = env['GITHUB_REPOSITORY']
            wf = env['LOCK_WORKFLOW']
            bind = env['LOCK_BIND'].split()
            event = {}
            if env.get('GITHUB_EVENT_PATH') and os.path.exists(env['GITHUB_EVENT_PATH']):
                event = json.load(open(env['GITHUB_EVENT_PATH']))
            head = event.get('head_commit') or {}
            ctx = {
                'approval': env.get('DELIVERY_APPROVAL', ''), 'bind': bind, 'pins': {n: env.get(n, '') for n in bind},
                'event_name': env.get('GITHUB_EVENT_NAME', ''), 'ref': env.get('GITHUB_REF', ''), 'branch': env['LOCK_BRANCH'],
                'sha': env.get('GITHUB_SHA', ''), 'before': event.get('before', ''), 'run_attempt': env.get('GITHUB_RUN_ATTEMPT', ''),
                'run_id': env.get('GITHUB_RUN_ID', ''), 'actor': env.get('GITHUB_ACTOR', ''),
                'owner': env.get('GITHUB_REPOSITORY_OWNER', ''), 'head_id': head.get('id', ''), 'head_message': head.get('message', ''),
                'scope': env.get('LOCK_SCOPE', ''), 'environment': env.get('LOCK_ENVIRONMENT', ''),
                'reviewers': env.get('LOCK_REVIEWERS', '').split(), 'stage': env.get('LOCK_STAGE', 'gate'),
                'require_review': env.get('LOCK_REQUIRE_GO') == '1',
            }

            def fetch_workflow_at(sha):
                p = subprocess.run(['gh', 'api', 'repos/%s/contents/%s?ref=%s' % (repo, wf, sha)],
                                   capture_output=True, text=True, timeout=120)
                if p.returncode != 0:
                    if 'HTTP 404' in (p.stderr or ''):
                        return None
                    raise RuntimeError((p.stderr or '').strip()[:200])
                return base64.b64decode(json.loads(p.stdout)['content']).decode('utf-8')

            def list_runs():
                out, name = [], os.path.basename(wf)
                for page in range(1, 31):
                    batch = gh_json('repos/%s/actions/workflows/%s/runs?per_page=100&page=%d' % (repo, name, page))['workflow_runs']
                    out += [{'id': r['id'], 'head_sha': r['head_sha'], 'message': (r.get('head_commit') or {}).get('message', '')}
                            for r in batch]
                    if len(batch) < 100:
                        return out
                raise RuntimeError('more than 3000 runs: cannot prove the approval is unused')

            def fetch_environment(name):
                return gh_json('repos/%s/environments/%s' % (repo, name))

            def fetch_approvals():
                return gh_json('repos/%s/actions/runs/%s/approvals' % (repo, ctx['run_id']))

            now = datetime.datetime.now(datetime.timezone.utc)
            go, reasons, aid = decide(ctx, fetch_workflow_at, list_runs, now, fetch_environment, fetch_approvals)
            for r in reasons:
                print('DELIVERY_LOCK ' + r)
            print('DELIVERY_LOCK stage=%s verdict=%s approval_id=%s pins=%s' % (env.get('LOCK_STAGE', 'gate'), 'GO' if go else 'LOCKED', aid or '-',
                                                                       ' '.join('%s=%s' % (n, ctx['pins'][n]) for n in bind)))
            if env.get('GITHUB_OUTPUT'):
                with open(env['GITHUB_OUTPUT'], 'a') as f:
                    f.write('go=%s\napproval_id=%s\n' % ('yes' if go else 'no', aid if go else ''))
            if env.get('LOCK_REQUIRE_GO') == '1' and not go:
                sys.exit(1)   # Paketjob: ohne gültige Freigabe JETZT kein Schritt weiter (auch nach Re-Run oder Ablauf)
            sys.exit(0 if go or ctx['approval'] in CLOSED else 1)


        if __name__ == '__main__':
            main()
        LOCKPY
        sha256sum "$RUNNER_TEMP/delivery_lock.py" > "$RUNNER_TEMP/delivery_lock.sha256"
        python3 -I "$RUNNER_TEMP/delivery_lock.py"
        case ";$DELIVERY_APPROVAL;" in *";ID=$APPROVAL_ID;"*) ;; *) echo "approval ID mismatch" >&2; exit 1 ;; esac
        echo "APPROVAL_ID=$APPROVAL_ID" >> "$GITHUB_ENV"
        echo "ARTIFACT_NAME=kadri-p4test-${SOURCE_SHA:0:7}-$APPROVAL_ID" >> "$GITHUB_ENV"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Exact paired sources (only this workflow differs from the source; helper pin = P4 test APK source)
      run: |
        set -euo pipefail
        WORKFLOW_SHA="$(git rev-parse HEAD)"
        git merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA"
        # Nur Liefer-/Prüfwerkzeuge dürfen nach SOURCE_SHA abweichen; alles, was ins Paket eingeht, ist exakt SOURCE_SHA.
        changed="$(git diff --name-only "$SOURCE_SHA" "$WORKFLOW_SHA" | grep -vxE '\.github/workflows/(p4-test-extension|ci)\.yml|tools/delivery/[^/]+\.py|tests/delivery/.+|[^/]+\.md' || true)"
        [ -z "$changed" ] || { echo "code differs from the approved source: $changed" >&2; exit 1; }
        git checkout -q --detach "$SOURCE_SHA"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        # WASM-Herkunft bleibt die im Quellstand dokumentierte; sie wird nicht auf HELPER_SHA umgeschrieben.
        grep -qx "helper_commit=$WASM_CORE_ORIGIN_SHA" vendor/kadri-pairing-poc/SOURCE
        grep -q '"p4_test_extension_id": "'"$P4_ID"'"' tools/p4test/identity.json
        grep -q '"production_status": "UNAPPROVED"' tools/p4test/identity.json
        echo "WORKFLOW_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Owndot/video-assistent-helper
        ref: ${{ env.HELPER_SHA }}
        path: helper
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Owndot/video-assistent-helper
        ref: ${{ env.WASM_CORE_ORIGIN_SHA }}
        path: helper-wasm-origin
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Toolchains (Rust from the WASM origin's rust-toolchain.toml, wasm-bindgen-cli 0.2.104)
      run: |
        set -euo pipefail
        (cd helper-wasm-origin/poc/pake-channel/core && rustup show active-toolchain && rustc -V)
        cargo install wasm-bindgen-cli --version 0.2.104 --locked
    - name: Rebuild the vendored WASM core from its origin commit and compare (provenance kept separate from HELPER_SHA)
      run: |
        set -euo pipefail
        test "$(git -C helper rev-parse HEAD)" = "$HELPER_SHA"
        test "$(git -C helper-wasm-origin rev-parse HEAD)" = "$WASM_CORE_ORIGIN_SHA"
        git -C helper merge-base --is-ancestor "$WASM_CORE_ORIGIN_SHA" "$HELPER_SHA"
        grep -q '"status": "UNAPPROVED"' helper/release/production-policy.json
        grep -q '"status": "UNAPPROVED"' helper-wasm-origin/release/production-policy.json
        # Nur Information für die Evidenz: ob sich die Kern-Quellen zwischen WASM-Herkunft und Helper-Anwendungscode geändert haben.
        if git -C helper diff --quiet "$WASM_CORE_ORIGIN_SHA" "$HELPER_SHA" -- poc/pake-channel/core poc/android-capability/tools/build-wasm-kadri.sh; then
          echo "WASM_CORE_SOURCES_DIFFER=no" >> "$GITHUB_ENV"; else echo "WASM_CORE_SOURCES_DIFFER=yes" >> "$GITHUB_ENV"; fi
        bash helper-wasm-origin/poc/android-capability/tools/build-wasm-kadri.sh "$RUNNER_TEMP/wasm"
        for f in kadri_pairing_poc.js kadri_pairing_poc_bg.wasm; do cmp "$RUNNER_TEMP/wasm/kadri-wasm/$f" "vendor/kadri-pairing-poc/$f"; done
        test "$(sha256sum < vendor/kadri-pairing-poc/kadri_pairing_poc_bg.wasm | cut -d' ' -f1)" = "$(sed -n 's/^sha256_wasm=//p' vendor/kadri-pairing-poc/SOURCE)"
        test "$(sha256sum < vendor/kadri-pairing-poc/kadri_pairing_poc.js | cut -d' ' -f1)" = "$(sed -n 's/^sha256_js=//p' vendor/kadri-pairing-poc/SOURCE)"
        echo "WASM_SHA256=$(sha256sum < vendor/kadri-pairing-poc/kadri_pairing_poc_bg.wasm | cut -d' ' -f1)" >> "$GITHUB_ENV"
        echo "WASM_JS_SHA256=$(sha256sum < vendor/kadri-pairing-poc/kadri_pairing_poc.js | cut -d' ' -f1)" >> "$GITHUB_ENV"
        echo "PASS: vendored WASM core rebuilt bit-identically from its origin $WASM_CORE_ORIGIN_SHA (paired helper app code: $HELPER_SHA)"
    - name: Desktop helper (real ChannelServer and engines of the paired helper application commit HELPER_SHA)
      run: bash helper/tests/java/channel/build.sh "$RUNNER_TEMP/helper-host"
    - name: Playwright (Chromium) and xvfb
      run: |
        set -euo pipefail
        npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
        npx playwright install --with-deps chromium
        sudo apt-get install -y xvfb
    - name: Build; channel only in the Chrome build, nothing of the legacy helper anywhere
      run: |
        set -euo pipefail
        node tools/build.js
        test -f dist/chrome/channel/kadri_pairing_poc_bg.wasm
        test ! -e dist/firefox/channel
        test ! -e dist/test
        if grep -rnE "'X-EVP-Key' *:|['\"]http://127\\.0\\.0\\.1:47811|KADRI_HELPER_KEY" dist/chrome --include=*.js | grep -vE '^[^:]+:[0-9]+: *//'; then echo 'legacy helper client in the build'; exit 1; fi
        echo 'PASS: channel in dist/chrome; no legacy helper client, key or port'
    - name: Identity and P4 package from two build paths (byte-identical ZIP)
      run: |
        set -euo pipefail
        node tests/channel/p4_identity_check.js
        python3 tests/p4_device_page_check.py
        mkdir -p "$RUNNER_TEMP/second-source"
        git archive "$SOURCE_SHA" | tar -x -C "$RUNNER_TEMP/second-source"
        (cd "$RUNNER_TEMP/second-source" && node tools/build.js)
        python3 tools/p4test/pack-extension.py dist/chrome "$RUNNER_TEMP/p4-a.zip"
        python3 tools/p4test/pack-extension.py "$RUNNER_TEMP/second-source/dist/chrome" "$RUNNER_TEMP/p4-b.zip"
        cmp "$RUNNER_TEMP/p4-a.zip" "$RUNNER_TEMP/p4-b.zip"
        python3 - "$RUNNER_TEMP/p4-a.zip" <<'PY'
        import json, sys, zipfile
        z = zipfile.ZipFile(sys.argv[1])
        m = json.loads(z.read('manifest.json'))
        assert m['name'] == 'Kadri P4 TEST' and 'UNAPPROVED' in m['description'], m['name']
        assert m['permissions'] == ['storage', 'declarativeNetRequestWithHostAccess', 'scripting'], m['permissions']
        assert not any(k in m for k in ['update_url', 'externally_connectable']), 'unexpected manifest key'
        assert 'channel/kadri_pairing_poc_bg.wasm' in z.namelist()
        bad = [n for n in z.namelist() if n.startswith('/') or '..' in n.split('/') or n.lower().endswith(('.pem', '.p12', '.key', '.crx'))]
        assert not bad, bad
        print('PASS: Kadri P4 TEST, permissions', m['permissions'], 'host permissions', m.get('host_permissions'), f'{len(z.namelist())} files')
        PY
        mkdir -p "$RUNNER_TEMP/packaged-extension"
        unzip -q "$RUNNER_TEMP/p4-a.zip" -d "$RUNNER_TEMP/packaged-extension"
        sha256sum "$RUNNER_TEMP/p4-a.zip" > "$RUNNER_TEMP/zip-before.sha256"
        rm -rf "$RUNNER_TEMP/second-source" "$RUNNER_TEMP/p4-b.zip"
    - name: Pairing with the paired helper - exact packaged extension against the real ChannelServer (channel security, fail-closed)
      env:
        HELPER_HOST_DIR: ${{ runner.temp }}/helper-host
        CHANNEL_DIST_DIR: ${{ runner.temp }}/packaged-extension
      run: |
        set -euo pipefail
        node tests/channel/channel_integration_check.js
        node tests/channel/download_integration_check.js
        node tests/channel/hls_integration_check.js
        node tests/channel/channel_browser_check.js
        node tests/channel/channel_netguard_failure_check.js
    - name: Fixed ID and separate extension data in a disposable Chromium profile
      run: |
        set -euo pipefail
        NODE_PATH="$PWD/node_modules" xvfb-run -a node tools/p4test/isolation.cjs "$RUNNER_TEMP/packaged-extension" "$PWD/dist/chrome"
        sha256sum -c "$RUNNER_TEMP/zip-before.sha256"
    - name: Require complete normal CI on the exact source commit AND on the workflow commit (pair test against HELPER_SHA) before upload
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git diff --exit-code
        for sha in "$SOURCE_SHA" "$WORKFLOW_SHA"; do
          for attempt in $(seq 1 160); do
            gh api "repos/Owndot/Kadri/actions/runs?head_sha=$sha" > "$RUNNER_TEMP/ci-state.json"
            status=$(python3 -c 'import json,sys; a=[r for r in json.load(open(sys.argv[1]))["workflow_runs"] if r["path"]==".github/workflows/ci.yml"]; r=max(a,key=lambda r:r["id"]) if a else {}; print((r.get("conclusion") or "failure") if r.get("status")=="completed" else "pending")' "$RUNNER_TEMP/ci-state.json")
            if [ "$status" = success ]; then break; fi
            if [ "$status" != pending ]; then echo "Required CI on $sha: $status"; exit 1; fi
            sleep 15
          done
          test "$status" = success
          echo "PASS: normal CI (ci.yml) succeeded on $sha"
        done
    - name: Delivery - extension folder, separate ZIP, SHA256SUMS, evidence (commits, ID, expiry)
      run: |
        set -euo pipefail
        sha256sum -c "$RUNNER_TEMP/zip-before.sha256"
        python3 - <<'PY'
        import datetime, hashlib, json, os, zipfile
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])
        z = zipfile.ZipFile(root / 'p4-a.zip')
        expected = {n: z.read(n) for n in z.namelist()}
        used = {p.relative_to(root / 'packaged-extension').as_posix(): p.read_bytes() for p in (root / 'packaged-extension').rglob('*') if p.is_file()}
        changed = [n for n, b in expected.items() if used.get(n) != b]
        extra = sorted(set(used) - set(expected))
        assert not changed, ('tested files changed', changed)
        assert all(n.startswith('_metadata/') for n in extra), ('unexpected browser files', extra)
        # Ausgeliefert werden die unveränderlichen, reproduzierbar gebauten ZIP-Inhalte, nie der Browser-Cache.
        d = root / 'deliver'; folder = d / 'kadri-p4-test'
        for n, b in expected.items():
            p = Path(n); assert not p.is_absolute() and '..' not in p.parts
            (folder / p).parent.mkdir(parents=True, exist_ok=True); (folder / p).write_bytes(b)
        assert {p.relative_to(folder).as_posix(): p.read_bytes() for p in folder.rglob('*') if p.is_file()} == expected
        (d / 'kadri-p4-test-extension.zip').write_bytes((root / 'p4-a.zip').read_bytes())
        zsha = hashlib.sha256((d / 'kadri-p4-test-extension.zip').read_bytes()).hexdigest()
        now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
        m = json.loads(expected['manifest.json'])
        ev = {
          'purpose': 'Owner-approved isolated Samsung Android 17 diagnostic test. NOT a release. Production stays UNAPPROVED.',
          'approval_id': os.environ['APPROVAL_ID'],
          'changes': 'Since the last P4 delivery (Kadri 7811d5a): bounded helper HLS planning phases are shown in anonymous diagnostics. No download, credential, network-boundary or retry changes. Real HTTP 404/412 remains open.',
          # Die gepaarte P4-Test-App wird mit einem neuen Wegwerf-Signierer gebaut: eine vorhandene de.evp.helfer.p4test
          # muss deinstalliert und die neue installiert werden; Kadri P4 TEST muss danach neu gekoppelt werden.
          'helper_update_required': True,
          'helper_replacement': 'uninstall any existing de.evp.helfer.p4test, then install the paired P4 test APK (new throwaway signer; in-place update impossible)',
          'pairing_reset_required': True,
          'pairing_reset_reason': 'the replaced P4 helper has a new channel identity; pair Kadri P4 TEST with it again (existing P4 pairing is not compatible)',
          'existing_p4_install_compatible': False,
          'extension_update': 'replace the unpacked Kadri P4 TEST folder (same fixed ID); never touch the production or C3 test extensions',
          'extension_name': m['name'], 'extension_version': m['version'], 'extension_id': os.environ['P4_ID'],
          'zip': 'kadri-p4-test-extension.zip', 'zip_sha256': zsha, 'folder': 'kadri-p4-test',
          'permissions': m['permissions'], 'host_permissions': m.get('host_permissions'),
          'private_key': 'none (fixed public key only)',
          'kadri_source_commit': os.environ['SOURCE_SHA'], 'kadri_workflow_commit': os.environ['WORKFLOW_SHA'],
          'helper_pair_commit': os.environ['HELPER_SHA'], 'helper_pair_role': 'application code of the paired P4 test APK; channel test ran against its real ChannelServer',
          'helper_package': os.environ['HELPER_PACKAGE'],
          'wasm_core_origin_commit': os.environ['WASM_CORE_ORIGIN_SHA'],
          'wasm_core_sha256': os.environ['WASM_SHA256'], 'wasm_core_js_sha256': os.environ['WASM_JS_SHA256'],
          'wasm_core_rebuilt_bit_identically_from_origin': True,
          'wasm_core_sources_differ_between_origin_and_helper_pair': os.environ['WASM_CORE_SOURCES_DIFFER'] == 'yes',
          'device_test_page': f"https://rawcdn.githack.com/Owndot/Kadri/{os.environ['SOURCE_SHA']}/tests/web/public/p4-hls.html",
          'workflow_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          'artifact': os.environ['ARTIFACT_NAME'],
          'built_at': now.isoformat(), 'artifact_expires_at': (now + datetime.timedelta(days=int(os.environ['RETENTION_DAYS']))).isoformat(),
          'production_status': 'UNAPPROVED',
        }
        (d / 'p4test-extension-evidence.json').write_text(json.dumps(ev, indent=2, ensure_ascii=False) + '\n')
        lines = [f"{hashlib.sha256((d / n).read_bytes()).hexdigest()}  {n}" for n in ['kadri-p4-test-extension.zip', 'p4test-extension-evidence.json']]
        lines += [f"{hashlib.sha256(b).hexdigest()}  kadri-p4-test/{n}" for n, b in sorted(expected.items())]
        (d / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
        print('\n'.join(lines[:2])); print(json.dumps(ev, indent=2, ensure_ascii=False))
        PY
        (cd "$RUNNER_TEMP/deliver" && sha256sum -c SHA256SUMS > /dev/null)
        echo "PASS: delivery = exactly the tested package ($(find "$RUNNER_TEMP/deliver/kadri-p4-test" -type f | wc -l) files)"
    - name: Delivery lock re-checked immediately before upload (approval still valid, first attempt, unused)
      env:
        GH_TOKEN: ${{ github.token }}
        LOCK_BIND: SOURCE_SHA HELPER_SHA WASM_CORE_ORIGIN_SHA
        LOCK_BRANCH: feature/c3-helper-mp4
        LOCK_WORKFLOW: .github/workflows/p4-test-extension.yml
        LOCK_SCOPE: kadri-p4test
        LOCK_ENVIRONMENT: p4-delivery
        LOCK_REVIEWERS: ''   # festgelegte Reviewer-Identität(en), nur der Eigentümer trägt sie ein (leer = gesperrt)
        LOCK_REQUIRE_GO: "1"
        LOCK_STAGE: before-upload
      run: |
        # DELIVERY_LOCK_RECHECK_BEFORE_UPLOAD
        set -euo pipefail
        sha256sum -c "$RUNNER_TEMP/delivery_lock.sha256"
        python3 -I "$RUNNER_TEMP/delivery_lock.py"
    - name: Short-lived isolated P4 TEST extension only (public Actions artifact, not a release)
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ runner.temp }}/deliver/
        retention-days: ${{ env.RETENTION_DAYS }}
        if-no-files-found: error
        include-hidden-files: true
