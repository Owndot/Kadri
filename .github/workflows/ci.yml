name: Bauen und testen
on:
  push:
    branches: [main, codex/security-phase-1]
    paths-ignore: ['tests/mess_validation.py', '.github/workflows/performance-validation.yml', '*.md']
  workflow_dispatch:
  pull_request:
    paths-ignore: ['tests/mess_validation.py', '.github/workflows/performance-validation.yml', '*.md']
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Werkzeuge
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb zip
      - name: Bauen
        run: node tools/build.js --test
      - name: Security lifecycle tests first
        run: TESTS="test_guard.py test_redirect.py test_worker_restart.py" tests/run_all.sh
      - name: Remaining Chromium tests
        run: |
          export TESTS="$(python3 -c 'import glob,os; print(" ".join(os.path.basename(p) for p in sorted(glob.glob("tests/test_*.py")) if os.path.basename(p) not in {"test_guard.py","test_redirect.py","test_worker_restart.py"}))')"
          tests/run_all.sh | tee ergebnis.txt
          echo '### Ergebnis' >> "$GITHUB_STEP_SUMMARY"
          cat ergebnis.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kadri
          path: |
            dist/kadri-*.zip
            tests/out/*.log
